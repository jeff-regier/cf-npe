# @package _global_
defaults:
  - /problem: gaussian

problem:
  dim: 200

evaluator:
  _target_: cf_npe.evaluators.CompositeEvaluator
  evaluators:
    - _target_: cf_npe.evaluators.LogLikelihoodEvaluator
    - _target_: cf_npe.evaluators.C2STEvaluator
      n_pairs: ${scale.c2st_pairs}
      n_epochs: ${scale.c2st_epochs}
  sample_evaluators:
    - _target_: cf_npe.evaluators.VarianceCalibrationEvaluator
      n_samples: ${scale.calibration_samples}
    - _target_: cf_npe.evaluators.SBCEvaluator
      n_samples: ${scale.sbc_samples}
    - _target_: cf_npe.evaluators.TARPEvaluator
      n_samples: ${scale.tarp_samples}

train_fn:
  _target_: cf_npe.methods.cf_npe.train_cf_npe_single_fit

train_params:
  parallel_ensemble: true
  posterior_type: gaussian
  training:
    _target_: cf_npe.training.loop.TrainingConfig
    n_epochs: 100
    batch_size: ???
    lr: ???
    weight_decay: ???
    grad_clip: null
  encoder_cfg:
    _target_: cf_npe.problems.base.EncoderConfig
    hidden_dim: ???
    n_layers: ???
    dropout: ???
  stage2_cfg:
    _target_: cf_npe.stages.stage2.Stage2Config
    hidden_dim: ???
    n_layers: ???
    dropout: ???
    n_transforms: 2
    n_bins: 16
    tail_bound: 7.0
  stage2_training:
    _target_: cf_npe.training.loop.TrainingConfig
    n_epochs: 100
    batch_size: ???
    lr: ???
    weight_decay: ???
    grad_clip: null
n_train: 10000
seeds_per_job: 5
eval_batch_size: ${train_params.stage2_training.batch_size}
