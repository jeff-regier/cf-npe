# @package _global_
defaults:
  - /problem: strong_lensing

problem:
  encoder:
    _target_: cf_npe.problems.strong_lensing.SLEncoderArch
    base_channels: ???
    blocks_per_level: ???
    dropout: ???
    asinh_softening: ???
    activation: ???
    norm_groups: ???
    padding_mode: ???
    use_se: ???
    drop_path_max: ???
  mean_head:
    _target_: cf_npe.problems.strong_lensing.SLMeanHeadArch
    width: ???
    n_blocks: ???
    n_attention: ???
    attention_heads: 4
    dropout: 0.3
    use_pos_encoding: ???
    use_global_pool: ???
    activation: gelu
    norm_groups: 8
    padding_mode: reflect
    use_se: true
    drop_path_max: 0.1
  velocity_head:
    _target_: cf_npe.problems.strong_lensing.SLVelocityHeadArch
    data_encoding_dim: ???
    mu_proj_channels: ???
    n_transforms: ???
    n_bins: ???
    tail_bound: ???
    mask_kind: ???
    nsf_conditioner_width: ???
    nsf_n_blocks: ???
    nsf_n_attention: ???
    nsf_attention_heads: ???
    nsf_dropout: ???
    nsf_use_se: ???
    nsf_drop_path_max: ???
    nsf_use_pos_encoding: ???
    nsf_use_global_pool: ???

eval_problem:
  _target_: cf_npe.problems.StrongLensing
  dim: ${problem.dim}
  source_resolution: ${problem.source_resolution}
  image_resolution: ${problem.image_resolution}
  noise_sigma: ${problem.noise_sigma}
  data_path: ${problem.data_path}
  split_seed: ${seed}
  test_fraction: ${problem.test_fraction}
  is_test: true

evaluator:
  _target_: cf_npe.evaluators.CompositeEvaluator
  evaluators:
    - _target_: cf_npe.evaluators.LogLikelihoodEvaluator
    - _target_: cf_npe.evaluators.C2STEvaluator
      n_pairs: ${scale.sl_c2st_pairs}
      n_epochs: ${scale.c2st_epochs}
  sample_evaluators:
    - _target_: cf_npe.evaluators.TARPEvaluator
      n_samples: ${scale.tarp_samples}
    - _target_: cf_npe.evaluators.SBCEvaluator
      n_samples: ${scale.sbc_samples}
    - _target_: cf_npe.evaluators.VarianceCalibrationEvaluator
      n_samples: ${scale.calibration_samples}

train_fn:
  _target_: cf_npe.methods.cf_npe.train_stage2_only

train_params:
  in_fold_residuals: false
  posterior_type: nsf
  stage2_mixture: false
  parallel_ensemble: false
  stage1_cache_path: ${stage1_from}/cache/stage1_seed__SEED__.pt
  stage2_cfg:
    _target_: cf_npe.stages.stage2.Stage2Config
    residual: true
  stage2_training:
    _target_: cf_npe.training.loop.TrainingConfig
    n_epochs: 100
    batch_size: 128
    lr: ???
    weight_decay: ???
    grad_clip: null
n_train: 10000
use_amp: true
seeds_per_job: 1
eval_batch_size: ${train_params.stage2_training.batch_size}
