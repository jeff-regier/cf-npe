[project]
name = "cf-npe"
version = "0.1.0"
description = "Cross-Fitting Neural Posterior Estimation"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Jeffrey Regier", email = "regier@umich.edu"}]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.9.1",
    "numpy>=1.26",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pyyaml>=6.0",
    "zuko>=1.5",
    "lenstronomy>=1.14.0",
    "hydra-optuna-sweeper>=1.2.0",
]

[project.urls]
Repository = "https://github.com/jeff-regier/cf-npe"

[project.scripts]
run-sweep = "cf_npe.runner.run_sweep:main"
run-tune = "cf_npe.runner.run_tune:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cf_npe*"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-xdist>=3.8.0",
    "ruff>=0.14.13",
    "ty>=0.0.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n 6"
